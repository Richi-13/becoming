<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0e0e">
<title>Becoming</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0e;--bg2:#161616;--bg3:#1e1e1e;
    --border:#2a2a2a;--text:#f0f0f0;--text2:#999;--text3:#555;
    --blue:#4a9eff;--blue-dim:#0f2a45;
    --green:#4ade80;--green-dim:#0f2a1a;
    --orange:#fb923c;--orange-dim:#2a1508;
    --grey:#a0a0a0;--grey-dim:#2a2a2a;
    --radius:10px;--radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;overscroll-behavior:none;}
  body{max-width:480px;margin:0 auto;padding-bottom:80px;}

  .header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
  .logo{font-size:22px;font-weight:300;letter-spacing:0.08em;}
  .logo span{color:var(--blue);}

  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:100;}
  .bnav-item{flex:1;padding:16px 4px;display:flex;justify-content:center;align-items:center;color:var(--text3);cursor:pointer;transition:color 0.2s;}
  .bnav-item.active{color:var(--blue);}
  .bnav-item svg{width:22px;height:22px;}

  .content{padding:16px 20px;}

  /* QUEUE HEADER & NAV */
  .queue-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .queue-title{font-size:16px;font-weight:500;letter-spacing:0.05em;display:flex;align-items:baseline;}
  
  .queue-nav{display:flex;gap:8px;}
  .q-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid transparent;background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}
  .q-btn svg{width:16px;height:16px;}
  
  .q-btn.upper{border-color:var(--blue);color:var(--blue);}
  .q-btn.upper.active{background:var(--blue-dim);color:var(--blue);}
  .q-btn.lower{border-color:var(--green);color:var(--green);}
  .q-btn.lower.active{background:var(--green-dim);color:var(--green);}
  .q-btn.cardio{border-color:var(--orange);color:var(--orange);}
  .q-btn.cardio.active{background:var(--orange-dim);color:var(--orange);}
  .q-btn.rest{border-color:var(--grey);color:var(--grey);}
  .q-btn.rest.active{background:var(--grey-dim);color:var(--grey);}

  /* EXERCISE CARDS */
  .ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;padding:14px;transition:opacity 0.3s;}
  .ex-card.skipped{opacity:0.4;pointer-events:none;}
  .ex-card.skipped .skip-btn{pointer-events:auto;color:var(--text);}
  
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .ex-name{font-size:14px;font-weight:500;line-height:1.4;}
  .skip-btn{font-size:16px;color:var(--text3);padding:4px 8px;cursor:pointer;border:1px solid transparent;border-radius:4px;display:flex;align-items:center;justify-content:center;min-width:32px;}
  .skip-btn:active{background:var(--bg3);border-color:var(--border);}
  
  /* SETS CONTROLS */
  .set-container{background:var(--bg);padding:12px 14px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;}
  
  .ctrl-row{display:flex;align-items:center;margin-bottom:14px;width:100%;}
  .ctrl-row:last-child{margin-bottom:0;}
  
  .set-index{font-size:14px;color:var(--text3);font-weight:500;}
  
  .timer-btn{font-family:'DM Mono',monospace;font-size:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;width:54px;height:26px;display:inline-flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .timer-btn.active.upper{color:var(--blue);border-color:var(--blue);background:var(--blue-dim);}
  .timer-btn.active.lower{color:var(--green);border-color:var(--green);background:var(--green-dim);}
  
  .timer-btn.completed {background:transparent; border-color:transparent;}
  .timer-btn.completed.upper {color:var(--blue);}
  .timer-btn.completed.lower {color:var(--green);}
  
  .stepper-ctrl{display:flex;align-items:center;justify-content:center;gap:8px;}
  .st-btn{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .st-val{font-size:18px;min-width:36px;text-align:center;display:inline-block;}
  .st-unit{font-size:12px;color:var(--text3);}

  .native-slider{width:140px;-webkit-appearance:none;appearance:none;background:var(--bg3);height:4px;border-radius:2px;outline:none;touch-action:pan-y;}
  .native-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer;}
  .native-slider.green::-webkit-slider-thumb{background:var(--green);}
  .native-slider.orange::-webkit-slider-thumb{background:var(--orange);}

  .save-btn{width:60%;margin:16px auto 0;display:block;padding:14px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:var(--radius-sm);color:var(--blue);font-size:14px;cursor:pointer;letter-spacing:0.04em;}
  
  /* CALENDAR */
  .month-blue{color:var(--blue);font-weight:500;font-size:16px;text-transform:none;}
  .year-mini{font-size:10px;color:var(--text3);margin-left:6px;}
  .cal-nav{display:flex;gap:6px;}
  .cal-btn{font-size:22px;padding:4px 18px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
  .cal-btn:active{background:var(--border);}
  
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;}
  .cal-day-header{font-size:10px;color:var(--text3);text-align:center;padding-bottom:4px;}
  .cal-day{aspect-ratio:1;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid var(--border);color:var(--text2);transition:all 0.2s;}
  .cal-day.done-upper{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}
  .cal-day.done-lower{background:var(--green-dim);border-color:var(--green);color:var(--green);}
  .cal-day.done-cardio{background:var(--orange-dim);border-color:var(--orange);color:var(--orange);}
  .cal-day.done-rest{background:var(--grey-dim);border-color:var(--grey);color:var(--grey);}
  .cal-day.today-highlight{border:1.5px solid var(--text);color:var(--text);font-weight:500;}

  /* PROGRESS BAR STYLES */
  .prog-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .prog-rows{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .prog-row{display:flex;align-items:center;gap:8px;}
  .prog-date-lbl{font-size:10px;color:var(--text3);min-width:32px;}
  .prog-bar-wrap{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
  .prog-bar{height:100%;border-radius:2px;transition:width 0.4s;background:var(--blue);}
  .prog-val{font-size:10px;color:var(--text2);min-width:40px;text-align:right;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">be<span>coming</span></div>
</div>

<!-- VIEW: WORKOUT -->
<div id="view-workout" class="content">
  <div class="queue-header">
    <div class="queue-title" id="q-title">ВЕРХ</div>
    
    <div class="queue-nav">
      <button class="q-btn upper" id="qbtn-0" onclick="setQueue(0)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
      <button class="q-btn lower" id="qbtn-1" onclick="setQueue(1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
      </button>
      <button class="q-btn cardio" id="qbtn-2" onclick="setQueue(2)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"></path></svg>
      </button>
      <button class="q-btn rest" id="qbtn-3" onclick="setQueue(3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
      </button>
    </div>
  </div>
  
  <div id="workout-list"></div>
  <button class="save-btn" onclick="finishWorkout()" id="finish-btn">готово ✓</button>
</div>

<!-- VIEW: CALENDAR -->
<div id="view-calendar" class="content" style="display:none;">
  <div class="queue-header">
    <div class="queue-title" id="cal-title"><span class="month-blue">Июль</span><span class="year-mini">2026</span></div>
    <div class="cal-nav">
      <button class="cal-btn" id="btn-today" style="display:none; font-size:12px; padding: 6px 12px;" onclick="resetMonth()">⊙</button>
      <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
      <button class="cal-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- VIEW: PROGRESS -->
<div id="view-progress" class="content" style="display:none;">
  <div class="queue-title" style="margin-bottom:16px; justify-content:center; text-transform:none; font-size:15px; color:var(--text);">Прогрессия</div>
  <div id="progress-list"></div>
</div>

<div class="bottom-nav">
  <div class="bnav-item active" id="bnav-workout" onclick="switchView('workout')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
  </div>
  <div class="bnav-item" id="bnav-calendar" onclick="switchView('calendar')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
  </div>
  <div class="bnav-item" id="bnav-progress" onclick="switchView('progress')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
  </div>
</div>

<script>
const SK = 'becoming_v16';
const QUEUE_ORDER = ['upper', 'lower', 'cardio', 'rest'];
const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const TIMER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><polyline points="20 6 9 17 4 12"></polyline></svg>';

const EXERCISES = {
  upper: [
    {n: 'Отжимания на гантелях в дефиците', sets: 3, type: 'mixed'},
    {n: 'Тяга гантели одной рукой', sets: 3, type: 'mixed'},
    {n: 'Махи в стороны', sets: 3, type: 'mixed'},
    {n: 'Обратные махи в наклоне', sets: 3, type: 'mixed'}
  ],
  lower: [
    {n: 'Болгарские сплит-приседы', sets: 3, type: 'mixed'},
    {n: 'Румынская тяга', sets: 3, type: 'mixed'},
    {n: 'Молотки (hammer curls)', sets: 3, type: 'mixed'},
    {n: 'Скручивания', sets: 3, type: 'reps_only'}
  ],
  cardio: [
    {n: 'Берпи', sets: 1, type: 'time'},
    {n: 'Бег / Скакалка', sets: 1, type: 'time'}
  ]
};

let appState = {
  queueIdx: 0, 
  records: {}, 
  history: []  
};

let calDate = new Date();
let timers = {}; 

try {
  const s = localStorage.getItem(SK);
  if (s) appState = Object.assign(appState, JSON.parse(s));
} catch(e){}

function save() {
  localStorage.setItem(SK, JSON.stringify(appState));
}

function switchView(v) {
  ['workout', 'calendar', 'progress'].forEach(view => {
    document.getElementById(`view-${view}`).style.display = v === view ? 'block' : 'none';
    document.getElementById(`bnav-${view}`).classList.toggle('active', v === view);
  });
  if(v === 'calendar') renderCalendar();
  if(v === 'progress') renderProgress();
}

function setQueue(idx) {
  appState.queueIdx = idx;
  save();
  renderWorkout();
}

function toggleSkip(exName, btnEl) {
  const card = btnEl.closest('.ex-card');
  const isSkipped = !appState.records[exName].skipped;
  appState.records[exName].skipped = isSkipped;
  
  if (isSkipped) {
    card.classList.add('skipped');
    btnEl.innerHTML = '↺';
  } else {
    card.classList.remove('skipped');
    btnEl.innerHTML = '✕';
  }
}

function startTimer(id, btn, currentType) {
  if (btn.classList.contains('completed')) {
    btn.className = 'timer-btn';
    btn.innerHTML = TIMER_ICON;
    return;
  }

  if (timers[id]) {
    clearInterval(timers[id]);
    delete timers[id];
    btn.innerHTML = TIMER_ICON;
    btn.classList.remove('active', currentType);
    return;
  }
  
  let t = 120;
  btn.classList.add('active', currentType);
  btn.textContent = '2:00';
  
  timers[id] = setInterval(() => {
    t--;
    const m = Math.floor(t / 60);
    const s = String(t % 60).padStart(2, '0');
    btn.textContent = `${m}:${s}`;
    
    if (t <= 0) {
      clearInterval(timers[id]);
      delete timers[id];
      btn.innerHTML = CHECK_ICON;
      btn.className = 'timer-btn completed ' + currentType;
    }
  }, 1000);
}

function renderWorkout() {
  const currentType = QUEUE_ORDER[appState.queueIdx];
  const list = document.getElementById('workout-list');
  const title = document.getElementById('q-title');
  const btn = document.getElementById('finish-btn');
  
  const colors = {upper: 'var(--blue)', lower: 'var(--green)', cardio: 'var(--orange)', rest: 'var(--grey)'};
  const names = {upper: 'ВЕРХ', lower: 'НИЗ', cardio: 'КАРДИО', rest: 'ОТДЫХ'};
  
  title.textContent = names[currentType];
  title.style.color = colors[currentType];
  
  for (let i = 0; i < 4; i++) {
    const qbtn = document.getElementById(`qbtn-${i}`);
    if (i === appState.queueIdx) qbtn.classList.add('active');
    else qbtn.classList.remove('active');
  }
  
  btn.style.color = colors[currentType];
  btn.style.borderColor = colors[currentType];
  btn.style.backgroundColor = currentType === 'rest' ? 'var(--grey-dim)' : `var(--${currentType}-dim)`;
  
  list.innerHTML = '';
  
  Object.keys(timers).forEach(k => clearInterval(timers[k]));
  timers = {};
  
  if (currentType === 'rest') {
    list.innerHTML = `
      <div class="ex-card" style="text-align:center; padding: 24px 14px;">
        <div style="font-size:16px;color:var(--grey);margin-bottom:10px;letter-spacing:0.05em;">ДЕНЬ СТРОИТЕЛЬСТВА</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6;">Мышцы растут не во время тренировки,<br>а прямо сейчас. Дай им ресурс.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;">
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">БЕЛОК</div>
            <div style="font-size:15px;color:var(--text);">150+ г</div>
          </div>
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">СОН</div>
            <div style="font-size:15px;color:var(--text);">7-9 ч</div>
          </div>
        </div>
      </div>`;
    btn.innerHTML = 'готово ✓';
    return;
  }

  btn.innerHTML = 'готово ✓';
  
  EXERCISES[currentType].forEach((ex) => {
    if(!appState.records[ex.n]) appState.records[ex.n] = { skipped: false };
    const rec = appState.records[ex.n];
    
    const card = document.createElement('div');
    card.className = 'ex-card' + (rec.skipped ? ' skipped' : '');
    card.innerHTML = `
      <div class="ex-head">
        <div class="ex-name" style="color:${colors[currentType]}">${ex.n}</div>
        <div class="skip-btn" onclick="toggleSkip('${ex.n}', this)">${rec.skipped ? '↺' : '✕'}</div>
      </div>
    `;
    
    for(let s=0; s<ex.sets; s++) {
      const setBox = document.createElement('div');
      setBox.className = 'set-container';
      
      const tid = `timer_${ex.n.replace(/\s+/g, '')}_${s}`;
      
      if(rec[`w${s}`] === undefined) rec[`w${s}`] = ex.type === 'reps_only' ? 0 : 5;
      if(rec[`r${s}`] === undefined) rec[`r${s}`] = 10;
      
      const maxRange = ex.type === 'time' ? 60 : 30;
      const unitStr = ex.type === 'time' ? 'мин' : 'раз';
      
      // ВЕРХНИЙ РЯД (Индекс + Степперы веса + Пустая заглушка справа)
      const topRow = document.createElement('div');
      topRow.className = 'ctrl-row';
      topRow.style.justifyContent = 'space-between';
      
      let centerHtml = '';
      if(ex.type === 'mixed') {
        centerHtml = `
          <div class="stepper-ctrl">
            <button class="st-btn" onclick="updateWeight('${ex.n}', ${s}, -1)">-</button>
            <div><span class="st-val" id="w_val_${ex.n}_${s}">${rec[`w${s}`]}</span> <span class="st-unit">кг</span></div>
            <button class="st-btn" onclick="updateWeight('${ex.n}', ${s}, 1)">+</button>
          </div>
        `;
      } else {
        centerHtml = `<div style="flex:1;"></div>`;
      }
      
      topRow.innerHTML = `
        <div class="set-index" style="width: 64px; text-align: left;">${currentType === 'cardio' ? '' : ROMAN[s]}</div>
        ${centerHtml}
        <div style="width: 64px;"></div>
      `;
      setBox.appendChild(topRow);
      
      // НИЖНИЙ РЯД (Таймер слева + Ползунок по центру + Счетчик справа)
      const bottomRow = document.createElement('div');
      bottomRow.className = 'ctrl-row';
      bottomRow.style.justifyContent = 'space-between';
      
      let timerHtml = '';
      if (currentType !== 'cardio') {
         timerHtml = `<button class="timer-btn" onclick="startTimer('${tid}', this, '${currentType}')">${TIMER_ICON}</button>`;
      } else {
         timerHtml = ``;
      }
      
      if(ex.type === 'mixed') {
        bottomRow.innerHTML = `
          <div style="width: 64px; text-align: left; display: flex; align-items: center;">${timerHtml}</div>
          <input type="range" min="1" max="${maxRange}" value="${rec[`r${s}`]}" class="native-slider ${currentType}" 
            oninput="updateSlider('${ex.n}', ${s}, this.value)">
          <div style="width: 64px; text-align: right; white-space: nowrap;">
            <span class="st-val" id="r_val_${ex.n}_${s}">${rec[`r${s}`]}</span> <span class="st-unit">${unitStr}</span>
          </div>
        `;
        setBox.appendChild(bottomRow);
      } else {
        // Если это reps_only или cardio — выстраиваем один идеально отцентрованный ряд
        topRow.innerHTML = `
          <div class="set-index" style="width: 64px; text-align: left;">${currentType === 'cardio' ? '' : ROMAN[s]}</div>
          <input type="range" min="1" max="${maxRange}" value="${rec[`r${s}`]}" class="native-slider ${currentType}" 
            oninput="updateSlider('${ex.n}', ${s}, this.value)">
          <div style="width: 64px; text-align: right; white-space: nowrap;">
            <span class="st-val" id="r_val_${ex.n}_${s}">${rec[`r${s}`]}</span> <span class="st-unit">${unitStr}</span>
          </div>
        `;
      }
      
      card.appendChild(setBox);
    }
    list.appendChild(card);
  });
}

function updateWeight(exName, setIdx, delta) {
  let current = appState.records[exName][`w${setIdx}`] || 0;
  current = Math.max(0, current + delta);
  appState.records[exName][`w${setIdx}`] = current;
  document.getElementById(`w_val_${exName}_${setIdx}`).textContent = current;
}

function updateSlider(exName, setIdx, val) {
  appState.records[exName][`r${setIdx}`] = parseInt(val);
  document.getElementById(`r_val_${exName}_${setIdx}`).textContent = val;
}

function finishWorkout() {
  const currentType = QUEUE_ORDER[appState.queueIdx];
  const today = new Date().toISOString().split('T')[0];
  
  const snapshot = JSON.parse(JSON.stringify(appState.records));
  appState.history.push({ date: today, type: currentType, snapshot: snapshot });
  
  Object.keys(appState.records).forEach(key => appState.records[key].skipped = false);
  
  appState.queueIdx = (appState.queueIdx + 1) % QUEUE_ORDER.length;
  save();
  
  const btn = document.getElementById('finish-btn');
  btn.innerHTML = 'сохранено';
  setTimeout(() => {
    switchView('calendar');
    renderWorkout();
  }, 1000);
}

// Календарь
function changeMonth(dir) {
  calDate.setMonth(calDate.getMonth() + dir);
  renderCalendar();
}

function resetMonth() {
  calDate = new Date();
  renderCalendar();
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  const title = document.getElementById('cal-title');
  const btnToday = document.getElementById('btn-today');
  grid.innerHTML = '';
  
  const realToday = new Date();
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  
  title.innerHTML = `<span class="month-blue">${MONTHS[month]}</span><span class="year-mini">${year}</span>`;
  
  if (year !== realToday.getFullYear() || month !== realToday.getMonth()) {
    btnToday.style.display = 'block';
  } else {
    btnToday.style.display = 'none';
  }
  
  const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  daysOfWeek.forEach(d => {
    const div = document.createElement('div');
    div.className = 'cal-day-header';
    div.textContent = d;
    grid.appendChild(div);
  });
  
  let firstDay = new Date(year, month, 1).getDay();
  firstDay = firstDay === 0 ? 6 : firstDay - 1; 
  
  for(let i=0; i<firstDay; i++) {
    const emptyDiv = document.createElement('div');
    grid.appendChild(emptyDiv);
  }
  
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  
  for(let i=1; i<=daysInMonth; i++) {
    const dayStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const hit = appState.history.find(h => h.date === dayStr);
    const isToday = (year === realToday.getFullYear() && month === realToday.getMonth() && i === realToday.getDate());
    
    const div = document.createElement('div');
    div.className = 'cal-day';
    if(hit) div.classList.add(`done-${hit.type}`);
    if(isToday) div.classList.add('today-highlight');
    
    div.textContent = i;
    grid.appendChild(div);
  }
}

// Прогрессия
function getIsoWeek(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const week1 = new Date(d.getFullYear(), 0, 4);
  return d.getFullYear() + '-' + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function formatShortDate(dateStr) {
  const d = new Date(dateStr);
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
}

function renderProgress() {
  const container = document.getElementById('progress-list');
  container.innerHTML = '';
  
  const uniqueExercises = new Set();
  EXERCISES.upper.forEach(ex => uniqueExercises.add(ex.n));
  EXERCISES.lower.forEach(ex => uniqueExercises.add(ex.n));
  
  let hasData = false;
  
  uniqueExercises.forEach(exName => {
    const weeklyData = [];
    const seenWeeks = new Set();
    
    appState.history.forEach(entry => {
      if(entry.snapshot && entry.snapshot[exName] && !entry.snapshot[exName].skipped) {
        const weekKey = getIsoWeek(entry.date);
        
        if(!seenWeeks.has(weekKey)) {
          seenWeeks.add(weekKey);
          
          let vol = 0;
          for(let s=0; s<5; s++) {
            const r = entry.snapshot[exName][`r${s}`];
            const w = entry.snapshot[exName][`w${s}`];
            if(r !== undefined) {
              vol += (w > 0) ? (r * w) : r;
            }
          }
          
          if (vol > 0) {
            weeklyData.push({ date: formatShortDate(entry.date), vol: vol, type: entry.type });
          }
        }
      }
    });
    
    if(weeklyData.length > 0) {
      hasData = true;
      const maxVol = Math.max(...weeklyData.map(d => d.vol));
      
      const card = document.createElement('div');
      card.className = 'prog-card';
      
      let barColor = 'var(--blue)';
      if (EXERCISES.lower.find(e => e.n === exName)) barColor = 'var(--green)';
      
      let rows = '';
      weeklyData.forEach((d, i) => {
        const pct = maxVol > 0 ? Math.round((d.vol / maxVol) * 100) : 0;
        const prevVol = i > 0 ? weeklyData[i-1].vol : null;
        let deltaHtml = '';
        
        if (prevVol !== null) {
          const diff = d.vol - prevVol;
          if (diff > 0) deltaHtml = `<span style="color:var(--green);font-size:9px;">+${diff}</span>`;
          else if (diff < 0) deltaHtml = `<span style="color:var(--orange);font-size:9px;">${diff}</span>`;
        }
        
        rows += `
          <div class="prog-row">
            <div class="prog-date-lbl">${d.date}</div>
            <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%; background:${barColor}"></div></div>
            <div class="prog-val">${d.vol} ${deltaHtml}</div>
          </div>`;
      });
      
      card.innerHTML = `<div class="ex-name" style="color:${barColor}; margin-bottom:4px;">${exName}</div><div class="prog-rows">${rows}</div>`;
      container.appendChild(card);
    }
  });
  
  if(!hasData) {
    container.innerHTML = '<div style="text-align:center; color:var(--text3); padding:40px 0; font-size:13px;">Данных для анализа пока нет.</div>';
  }
}

renderWorkout();
</script>
