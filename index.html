<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0e0e">
<title>Becoming V3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0e;--bg2:#161616;--bg3:#1e1e1e;
    --border:#2a2a2a;--text:#f0f0f0;--text2:#888;--text3:#444;
    --blue:#4a9eff;--blue-dim:#0f2a45;
    --green:#4ade80;--green-dim:#0f2a1a;
    --orange:#fb923c;--orange-dim:#2a1508;
    --grey:#a0a0a0;--grey-dim:#2a2a2a;
    --radius:10px;--radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overscroll-behavior:none;}
  body{max-width:480px;margin:0 auto;padding-bottom:80px;}

  .header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
  .logo{font-family:'DM Mono',monospace;font-size:22px;font-weight:300;letter-spacing:0.08em;}
  .logo span{color:var(--blue);}

  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:100;}
  .bnav-item{flex:1;padding:16px 4px;text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);cursor:pointer;letter-spacing:0.04em;}
  .bnav-item.active{color:var(--blue);}

  .content{padding:16px 20px;}

  .queue-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .queue-title{font-family:'DM Mono',monospace;font-size:14px;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;}
  .override-btn{font-family:'DM Mono',monospace;font-size:10px;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;}
  
  .ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;padding:14px;}
  .ex-name{font-size:14px;font-weight:500;margin-bottom:12px;}
  
  .stepper-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:var(--bg);padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);}
  .stepper-lbl{font-size:12px;color:var(--text2);}
  .stepper-ctrl{display:flex;align-items:center;gap:12px;}
  .st-btn{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .st-btn:active{background:var(--border);}
  .st-val{font-family:'DM Mono',monospace;font-size:15px;min-width:30px;text-align:center;}
  .st-unit{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}

  .save-btn{width:100%;margin-top:16px;padding:14px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:var(--radius-sm);color:var(--blue);font-family:'DM Mono',monospace;font-size:14px;cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;transition:all 0.3s;}
  
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px;}
  .cal-day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;border:1px solid var(--border);color:var(--text3);}
  .cal-day.done-upper{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}
  .cal-day.done-lower{background:var(--green-dim);border-color:var(--green);color:var(--green);}
  .cal-day.done-cardio{background:var(--orange-dim);border-color:var(--orange);color:var(--orange);}
  .cal-day.done-rest{background:var(--grey-dim);border-color:var(--grey);color:var(--grey);}
</style>
</head>
<body>

<div class="header">
  <div class="logo">be<span>coming</span></div>
</div>

<div id="view-workout" class="content">
  <div class="queue-header">
    <div class="queue-title" id="q-title">Очередь: ВЕРХ</div>
    <button class="override-btn" onclick="overrideQueue()">Сменить ↻</button>
  </div>
  <div id="workout-list"></div>
  <button class="save-btn" onclick="finishWorkout()" id="finish-btn">Завершить тренировку</button>
</div>

<div id="view-calendar" class="content" style="display:none;">
  <div class="queue-title" style="margin-bottom:10px;">Активность (Этот месяц)</div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<div class="bottom-nav">
  <div class="bnav-item active" id="bnav-workout" onclick="switchView('workout')">тренировка</div>
  <div class="bnav-item" id="bnav-calendar" onclick="switchView('calendar')">календарь</div>
</div>

<script>
const SK = 'becoming_v6';
// Добавили день отдыха в очередь
const QUEUE_ORDER = ['upper', 'lower', 'cardio', 'rest'];
const EXERCISES = {
  upper: [
    {n: 'Отжимания на гантелях', sets: 3, type: 'reps'},
    {n: 'Тяга гантели в наклоне', sets: 3, type: 'weight'}
  ],
  lower: [
    {n: 'Болгарские сплит-приседы', sets: 3, type: 'weight'},
    {n: 'Румынская тяга', sets: 3, type: 'weight'}
  ],
  cardio: [
    {n: 'Берпи', sets: 1, type: 'time'},
    {n: 'Бег / Скакалка', sets: 1, type: 'time'}
  ]
};

let appState = {
  queueIdx: 0, 
  records: {}, 
  history: []  
};

try {
  const s = localStorage.getItem(SK);
  if (s) appState = Object.assign(appState, JSON.parse(s));
} catch(e){}

function save() {
  localStorage.setItem(SK, JSON.stringify(appState));
}

function switchView(v) {
  document.getElementById('view-workout').style.display = v === 'workout' ? 'block' : 'none';
  document.getElementById('view-calendar').style.display = v === 'calendar' ? 'block' : 'none';
  document.getElementById('bnav-workout').classList.toggle('active', v === 'workout');
  document.getElementById('bnav-calendar').classList.toggle('active', v === 'calendar');
  if(v === 'calendar') renderCalendar();
}

function overrideQueue() {
  appState.queueIdx = (appState.queueIdx + 1) % QUEUE_ORDER.length;
  save();
  renderWorkout();
}

function renderWorkout() {
  const currentType = QUEUE_ORDER[appState.queueIdx];
  const list = document.getElementById('workout-list');
  const title = document.getElementById('q-title');
  const btn = document.getElementById('finish-btn');
  
  const colors = {upper: 'var(--blue)', lower: 'var(--green)', cardio: 'var(--orange)', rest: 'var(--grey)'};
  const names = {upper: 'ВЕРХ', lower: 'НИЗ', cardio: 'КАРДИО', rest: 'ОТДЫХ'};
  
  title.textContent = `Очередь: ${names[currentType]}`;
  title.style.color = colors[currentType];
  btn.style.color = colors[currentType];
  btn.style.borderColor = colors[currentType];
  if(currentType === 'rest') btn.style.backgroundColor = 'var(--grey-dim)';
  else btn.style.backgroundColor = `var(--${currentType}-dim)`;
  
  list.innerHTML = '';
  
  // Если день отдыха - показываем карточку восстановления
  if (currentType === 'rest') {
    list.innerHTML = `
      <div class="ex-card" style="text-align:center; padding: 24px 14px;">
        <div style="font-family:'DM Mono',monospace;font-size:16px;color:var(--grey);margin-bottom:10px;letter-spacing:0.05em;">ДЕНЬ СТРОИТЕЛЬСТВА</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6;">Мышцы растут не во время тренировки,<br>а прямо сейчас. Дай им ресурс.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;">
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">БЕЛОК</div>
            <div style="font-family:'DM Mono',monospace;font-size:15px;color:var(--text);">150+ г</div>
          </div>
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">СОН</div>
            <div style="font-family:'DM Mono',monospace;font-size:15px;color:var(--text);">7-9 ч</div>
          </div>
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">ВОДА</div>
            <div style="font-family:'DM Mono',monospace;font-size:15px;color:var(--text);">2-3 л</div>
          </div>
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">ШАГИ</div>
            <div style="font-family:'DM Mono',monospace;font-size:15px;color:var(--text);">Легкая активность</div>
          </div>
        </div>
      </div>`;
    btn.textContent = 'Подтвердить отдых';
    return;
  }

  btn.textContent = 'Завершить тренировку';
  const exs = EXERCISES[currentType];
  
  exs.forEach((ex) => {
    const card = document.createElement('div');
    card.className = 'ex-card';
    card.innerHTML = `<div class="ex-name" style="color:${colors[currentType]}">${ex.n}</div>`;
    
    const rec = appState.records[ex.n] || {};
    
    if (ex.type === 'reps' || ex.type === 'weight') {
      if (ex.type === 'weight') {
        card.appendChild(createStepper(ex.n, 'w0', 'Рабочий вес', rec['w0'] || 5, 2.5, 'кг'));
      }
      for(let s=0; s<ex.sets; s++) {
        card.appendChild(createStepper(ex.n, `r${s}`, `Подход ${s+1} (повторения)`, rec[`r${s}`] || 10, 1, 'раз'));
      }
    } else if (ex.type === 'time') {
      card.appendChild(createStepper(ex.n, 't0', 'Время', rec['t0'] || 15, 5, 'мин'));
    }
    
    list.appendChild(card);
  });
}

function createStepper(exName, fieldId, label, initVal, step, unit) {
  const row = document.createElement('div');
  row.className = 'stepper-row';
  
  if(!appState.records[exName]) appState.records[exName] = {};
  appState.records[exName][fieldId] = initVal;

  row.innerHTML = `
    <div class="stepper-lbl">${label}</div>
    <div class="stepper-ctrl">
      <button class="st-btn" onclick="updateVal('${exName}', '${fieldId}', -${step})">-</button>
      <div><span class="st-val" id="val_${exName}_${fieldId}">${initVal}</span> <span class="st-unit">${unit}</span></div>
      <button class="st-btn" onclick="updateVal('${exName}', '${fieldId}', ${step})">+</button>
    </div>
  `;
  return row;
}

function updateVal(exName, fieldId, delta) {
  let current = appState.records[exName][fieldId] || 0;
  // Обработка чисел с плавающей точкой для весов (например 2.5)
  current = Math.round((current + delta) * 10) / 10;
  if(current < 0) current = 0;
  appState.records[exName][fieldId] = current;
  document.getElementById(`val_${exName}_${fieldId}`).textContent = current;
}

function finishWorkout() {
  const currentType = QUEUE_ORDER[appState.queueIdx];
  const today = new Date().toISOString().split('T')[0];
  
  if(!appState.history.find(h => h.date === today)) {
    appState.history.push({ date: today, type: currentType });
  }
  
  appState.queueIdx = (appState.queueIdx + 1) % QUEUE_ORDER.length;
  save();
  
  const btn = document.getElementById('finish-btn');
  btn.textContent = 'СОХРАНЕНО ✓';
  setTimeout(() => {
    switchView('calendar');
    renderWorkout();
  }, 1000);
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  
  const today = new Date();
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  
  for(let i=1; i<=daysInMonth; i++) {
    const dayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const hit = appState.history.find(h => h.date === dayStr);
    
    const div = document.createElement('div');
    div.className = 'cal-day';
    if(hit) div.classList.add(`done-${hit.type}`);
    
    div.textContent = i;
    grid.appendChild(div);
  }
}

renderWorkout();
</script>
</body>
</html>
