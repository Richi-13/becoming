<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0e0e">
<title>Becoming</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0e;--bg2:#161616;--bg3:#1e1e1e;
    --border:#2a2a2a;--text:#f0f0f0;--text2:#888;--text3:#444;
    --blue:#4a9eff;--blue-dim:#0f2a45;
    --green:#4ade80;--green-dim:#0f2a1a;
    --orange:#fb923c;--orange-dim:#2a1508;
    --grey:#a0a0a0;--grey-dim:#2a2a2a;
    --radius:10px;--radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overscroll-behavior:none;}
  body{max-width:480px;margin:0 auto;padding-bottom:80px;}

  .header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
  .logo{font-family:'DM Mono',monospace;font-size:22px;font-weight:300;letter-spacing:0.08em;}
  .logo span{color:var(--blue);}

  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:100;}
  .bnav-item{flex:1;padding:16px 4px;text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);cursor:pointer;letter-spacing:0.04em;}
  .bnav-item.active{color:var(--blue);}

  .content{padding:16px 20px;}

  .queue-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .queue-title{font-family:'DM Mono',monospace;font-size:14px;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;}
  .month-green{color:var(--green);font-weight:500;}
  .year-mini{font-size:10px;color:var(--text3);margin-left:6px;}
  
  .cal-nav{display:flex;gap:6px;}
  .cal-btn{font-family:'DM Mono',monospace;font-size:11px;padding:6px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;transition:all 0.2s;}
  .cal-btn:active{background:var(--border);}
  
  .ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;padding:14px;transition:opacity 0.3s;}
  .ex-card.skipped{opacity:0.4;pointer-events:none;}
  .ex-card.skipped .skip-btn{pointer-events:auto;color:var(--text);}
  
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .ex-name{font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;}
  .skip-btn{font-family:'DM Mono',monospace;font-size:16px;color:var(--text3);padding:4px 8px;cursor:pointer;border:1px solid transparent;border-radius:4px;display:flex;align-items:center;justify-content:center;min-width:32px;}
  .skip-btn:active{background:var(--bg3);border-color:var(--border);}
  
  .set-container{background:var(--bg);padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;}
  .set-title{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:6px;}
  
  .ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .ctrl-row:last-child{margin-bottom:0;}
  .ctrl-lbl{font-size:12px;color:var(--text2);}
  
  .stepper-ctrl{display:flex;align-items:center;gap:10px;}
  .st-btn{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .st-val{font-family:'DM Mono',monospace;font-size:14px;min-width:28px;text-align:center;}
  .st-unit{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}

  .slider-wrapper{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end;}
  .native-slider{width:120px;-webkit-appearance:none;appearance:none;background:var(--bg3);height:4px;border-radius:2px;outline:none;touch-action:pan-y;}
  .native-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;}
  .native-slider.green::-webkit-slider-thumb{background:var(--green);}
  .native-slider.orange::-webkit-slider-thumb{background:var(--orange);}

  .save-btn{width:100%;margin-top:16px;padding:14px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:var(--radius-sm);color:var(--blue);font-family:'DM Mono',monospace;font-size:14px;cursor:pointer;letter-spacing:0.04em;}
  
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px;}
  .cal-day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;border:1px solid var(--border);color:var(--text3);}
  .cal-day.done-upper{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}
  .cal-day.done-lower{background:var(--green-dim);border-color:var(--green);color:var(--green);}
  .cal-day.done-cardio{background:var(--orange-dim);border-color:var(--orange);color:var(--orange);}
  .cal-day.done-rest{background:var(--grey-dim);border-color:var(--grey);color:var(--grey);}

  /* PROGRESS BAR STYLES */
  .prog-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .prog-rows{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .prog-row{display:flex;align-items:center;gap:8px;}
  .prog-date-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);min-width:32px;}
  .prog-bar-wrap{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
  .prog-bar{height:100%;border-radius:2px;transition:width 0.4s;background:var(--blue);}
  .prog-val{font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);min-width:40px;text-align:right;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">be<span>coming</span></div>
</div>

<!-- VIEW: WORKOUT -->
<div id="view-workout" class="content">
  <div class="queue-header">
    <div class="queue-title" id="q-title">Очередь: ВЕРХ</div>
    <button class="cal-btn" onclick="overrideQueue()">Сменить ↻</button>
  </div>
  <div id="workout-list"></div>
  <button class="save-btn" onclick="finishWorkout()" id="finish-btn">готово ✓</button>
</div>

<!-- VIEW: CALENDAR -->
<div id="view-calendar" class="content" style="display:none;">
  <div class="queue-header">
    <div class="queue-title" id="cal-title">Активность <span class="month-green">июль</span><span class="year-mini">2026</span></div>
    <div class="cal-nav">
      <button class="cal-btn" id="btn-today" style="display:none;" onclick="resetMonth()">⊙</button>
      <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
      <button class="cal-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- VIEW: PROGRESS -->
<div id="view-progress" class="content" style="display:none;">
  <div class="queue-title" style="margin-bottom:16px; text-align:center; text-transform:none; font-size:15px; color:var(--text);">Прогрессия</div>
  <div id="progress-list"></div>
</div>

<div class="bottom-nav">
  <div class="bnav-item active" id="bnav-workout" onclick="switchView('workout')">тренировка</div>
  <div class="bnav-item" id="bnav-calendar" onclick="switchView('calendar')">календарь</div>
  <div class="bnav-item" id="bnav-progress" onclick="switchView('progress')">прогресс</div>
</div>

<script>
const SK = 'becoming_v9';
const QUEUE_ORDER = ['upper', 'lower', 'cardio', 'rest'];
const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

const EXERCISES = {
  upper: [
    {n: 'Отжимания на гантелях в дефиците', sets: 3, type: 'mixed'},
    {n: 'Тяга гантели одной рукой', sets: 3, type: 'mixed'},
    {n: 'Махи в стороны', sets: 3, type: 'mixed'},
    {n: 'Обратные махи в наклоне', sets: 3, type: 'mixed'}
  ],
  lower: [
    {n: 'Болгарские сплит-приседы', sets: 3, type: 'mixed'},
    {n: 'Румынская тяга', sets: 3, type: 'mixed'},
    {n: 'Молотки (hammer curls)', sets: 3, type: 'mixed'},
    {n: 'Скручивания', sets: 3, type: 'reps_only'}
  ],
  cardio: [
    {n: 'Берпи', sets: 1, type: 'time'},
    {n: 'Бег / Скакалка', sets: 1, type: 'time'}
  ]
};

let appState = {
  queueIdx: 0, 
  records: {}, 
  history: []  
};

let calDate = new Date();

try {
  const s = localStorage.getItem(SK);
  if (s) appState = Object.assign(appState, JSON.parse(s));
} catch(e){}

function save() {
  localStorage.setItem(SK, JSON.stringify(appState));
}

function switchView(v) {
  ['workout', 'calendar', 'progress'].forEach(view => {
    document.getElementById(`view-${view}`).style.display = v === view ? 'block' : 'none';
    document.getElementById(`bnav-${view}`).classList.toggle('active', v === view);
  });
  if(v === 'calendar') renderCalendar();
  if(v === 'progress') renderProgress();
}

function overrideQueue() {
  appState.queueIdx = (appState.queueIdx + 1) % QUEUE_ORDER.length;
  save();
  renderWorkout();
}

function toggleSkip(exName, btnEl) {
  const card = btnEl.closest('.ex-card');
  const isSkipped = !appState.records[exName].skipped;
  appState.records[exName].skipped = isSkipped;
  
  if (isSkipped) {
    card.classList.add('skipped');
    btnEl.innerHTML = '↺';
  } else {
    card.classList.remove('skipped');
    btnEl.innerHTML = '✕';
  }
}

function renderWorkout() {
  const currentType = QUEUE_ORDER[appState.queueIdx];
  const list = document.getElementById('workout-list');
  const title = document.getElementById('q-title');
  const btn = document.getElementById('finish-btn');
  
  const colors = {upper: 'var(--blue)', lower: 'var(--green)', cardio: 'var(--orange)', rest: 'var(--grey)'};
  const names = {upper: 'ВЕРХ', lower: 'НИЗ', cardio: 'КАРДИО', rest: 'ОТДЫХ'};
  
  title.textContent = `Очередь: ${names[currentType]}`;
  title.style.color = colors[currentType];
  btn.style.color = colors[currentType];
  btn.style.borderColor = colors[currentType];
  btn.style.backgroundColor = currentType === 'rest' ? 'var(--grey-dim)' : `var(--${currentType}-dim)`;
  
  list.innerHTML = '';
  
  if (currentType === 'rest') {
    list.innerHTML = `
      <div class="ex-card" style="text-align:center; padding: 24px 14px;">
        <div style="font-family:'DM Mono',monospace;font-size:16px;color:var(--grey);margin-bottom:10px;letter-spacing:0.05em;">ДЕНЬ СТРОИТЕЛЬСТВА</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6;">Мышцы растут не во время тренировки,<br>а прямо сейчас. Дай им ресурс.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;">
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;font-family:'DM Mono',monospace;">БЕЛОК</div>
            <div style="font-family:'DM Mono',monospace;font-size:15px;color:var(--text);">150+ г</div>
          </div>
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;font-family:'DM Mono',monospace;">СОН</div>
            <div style="font-family:'DM Mono',monospace;font-size:15px;color:var(--text);">7-9 ч</div>
          </div>
        </div>
      </div>`;
    btn.innerHTML = 'готово ✓';
    return;
  }

  btn.innerHTML = 'готово ✓';
  
  EXERCISES[currentType].forEach((ex) => {
    if(!appState.records[ex.n]) appState.records[ex.n] = { skipped: false };
    const rec = appState.records[ex.n];
    
    const card = document.createElement('div');
    card.className = 'ex-card' + (rec.skipped ? ' skipped' : '');
    card.innerHTML = `
      <div class="ex-head">
        <div class="ex-name" style="color:${colors[currentType]}">${ex.n}</div>
        <div class="skip-btn" onclick="toggleSkip('${ex.n}', this)">${rec.skipped ? '↺' : '✕'}</div>
      </div>
    `;
    
    for(let s=0; s<ex.sets; s++) {
      const setBox = document.createElement('div');
      setBox.className = 'set-container';
      setBox.innerHTML = `<div class="set-title">${ROMAN[s]} подход</div>`;
      
      if(rec[`w${s}`] === undefined) rec[`w${s}`] = ex.type === 'reps_only' ? 0 : 5;
      if(rec[`r${s}`] === undefined) rec[`r${s}`] = 10;
      
      if(ex.type === 'mixed') {
        const weightRow = document.createElement('div');
        weightRow.className = 'ctrl-row';
        weightRow.innerHTML = `<div class="ctrl-lbl">Вес:</div>
        <div class="stepper-ctrl">
          <button class="st-btn" onclick="updateWeight('${ex.n}', ${s}, -1)">-</button>
          <div><span class="st-val" id="w_val_${ex.n}_${s}">${rec[`w${s}`]}</span> <span class="st-unit">кг</span></div>
          <button class="st-btn" onclick="updateWeight('${ex.n}', ${s}, 1)">+</button>
        </div>`;
        setBox.appendChild(weightRow);
      }
      
      const repsRow = document.createElement('div');
      repsRow.className = 'ctrl-row';
      repsRow.innerHTML = `<div class="ctrl-lbl">${ex.type === 'time' ? 'Время:' : 'Раз:'}</div>`;
      
      const maxRange = ex.type === 'time' ? 60 : 30;
      const unitStr = ex.type === 'time' ? 'мин' : 'раз';
      
      const sliderWrap = document.createElement('div');
      sliderWrap.className = 'slider-wrapper';
      sliderWrap.innerHTML = `
        <input type="range" min="1" max="${maxRange}" value="${rec[`r${s}`]}" class="native-slider ${currentType}" 
          oninput="updateSlider('${ex.n}', ${s}, this.value)">
        <div><span class="st-val" id="r_val_${ex.n}_${s}">${rec[`r${s}`]}</span> <span class="st-unit">${unitStr}</span></div>
      `;
      repsRow.appendChild(sliderWrap);
      setBox.appendChild(repsRow);
      
      card.appendChild(setBox);
    }
    list.appendChild(card);
  });
}

function updateWeight(exName, setIdx, delta) {
  let current = appState.records[exName][`w${setIdx}`] || 0;
  current = Math.max(0, current + delta);
  appState.records[exName][`w${setIdx}`] = current;
  document.getElementById(`w_val_${exName}_${setIdx}`).textContent = current;
}

function updateSlider(exName, setIdx, val) {
  appState.records[exName][`r${setIdx}`] = parseInt(val);
  document.getElementById(`r_val_${exName}_${setIdx}`).textContent = val;
}

function finishWorkout() {
  const currentType = QUEUE_ORDER[appState.queueIdx];
  const today = new Date().toISOString().split('T')[0];
  
  const snapshot = JSON.parse(JSON.stringify(appState.records));
  appState.history.push({ date: today, type: currentType, snapshot: snapshot });
  
  Object.keys(appState.records).forEach(key => appState.records[key].skipped = false);
  
  appState.queueIdx = (appState.queueIdx + 1) % QUEUE_ORDER.length;
  save();
  
  const btn = document.getElementById('finish-btn');
  btn.innerHTML = 'сохранено';
  setTimeout(() => {
    switchView('calendar');
    renderWorkout();
  }, 1000);
}

// Календарь
function changeMonth(dir) {
  calDate.setMonth(calDate.getMonth() + dir);
  renderCalendar();
}

function resetMonth() {
  calDate = new Date();
  renderCalendar();
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  const title = document.getElementById('cal-title');
  const btnToday = document.getElementById('btn-today');
  grid.innerHTML = '';
  
  const realToday = new Date();
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  
  title.innerHTML = `Активность <span class="month-green">${MONTHS[month].toLowerCase()}</span><span class="year-mini">${year}</span>`;
  
  if (year !== realToday.getFullYear() || month !== realToday.getMonth()) {
    btnToday.style.display = 'block';
  } else {
    btnToday.style.display = 'none';
  }
  
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  
  for(let i=1; i<=daysInMonth; i++) {
    const dayStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const hit = appState.history.find(h => h.date === dayStr);
    
    const div = document.createElement('div');
    div.className = 'cal-day';
    if(hit) div.classList.add(`done-${hit.type}`);
    
    div.textContent = i;
    grid.appendChild(div);
  }
}

// Прогрессия (Только силовые)
function getIsoWeek(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const week1 = new Date(d.getFullYear(), 0, 4);
  return d.getFullYear() + '-' + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function formatShortDate(dateStr) {
  const d = new Date(dateStr);
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
}

function renderProgress() {
  const container = document.getElementById('progress-list');
  container.innerHTML = '';
  
  const uniqueExercises = new Set();
  // Добавляем только силовые упражнения, исключая кардио
  EXERCISES.upper.forEach(ex => uniqueExercises.add(ex.n));
  EXERCISES.lower.forEach(ex => uniqueExercises.add(ex.n));
  
  let hasData = false;
  
  uniqueExercises.forEach(exName => {
    const weeklyData = [];
    const seenWeeks = new Set();
    
    appState.history.forEach(entry => {
      if(entry.snapshot && entry.snapshot[exName] && !entry.snapshot[exName].skipped) {
        const weekKey = getIsoWeek(entry.date);
        
        if(!seenWeeks.has(weekKey)) {
          seenWeeks.add(weekKey);
          
          let vol = 0;
          for(let s=0; s<5; s++) {
            const r = entry.snapshot[exName][`r${s}`];
            const w = entry.snapshot[exName][`w${s}`];
            if(r !== undefined) {
              vol += (w > 0) ? (r * w) : r;
            }
          }
          
          if (vol > 0) {
            weeklyData.push({ date: formatShortDate(entry.date), vol: vol, type: entry.type });
          }
        }
      }
    });
    
    if(weeklyData.length > 0) {
      hasData = true;
      const maxVol = Math.max(...weeklyData.map(d => d.vol));
      
      const card = document.createElement('div');
      card.className = 'prog-card';
      
      let barColor = 'var(--blue)';
      if (EXERCISES.lower.find(e => e.n === exName)) barColor = 'var(--green)';
      
      let rows = '';
      weeklyData.forEach((d, i) => {
        const pct = maxVol > 0 ? Math.round((d.vol / maxVol) * 100) : 0;
        const prevVol = i > 0 ? weeklyData[i-1].vol : null;
        let deltaHtml = '';
        
        if (prevVol !== null) {
          const diff = d.vol - prevVol;
          if (diff > 0) deltaHtml = `<span style="color:var(--green);font-size:9px;">+${diff}</span>`;
          else if (diff < 0) deltaHtml = `<span style="color:var(--orange);font-size:9px;">${diff}</span>`;
        }
        
        rows += `
          <div class="prog-row">
            <div class="prog-date-lbl">${d.date}</div>
            <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%; background:${barColor}"></div></div>
            <div class="prog-val">${d.vol} ${deltaHtml}</div>
          </div>`;
      });
      
      card.innerHTML = `<div class="ex-name" style="color:${barColor}; margin-bottom:4px;">${exName}</div><div class="prog-rows">${rows}</div>`;
      container.appendChild(card);
    }
  });
  
  if(!hasData) {
    container.innerHTML = '<div style="text-align:center; color:var(--text3); padding:40px 0; font-family:\'DM Mono\',monospace; font-size:13px;">Данных для анализа пока нет.</div>';
  }
}

renderWorkout();
</script>
</body>
</html>
